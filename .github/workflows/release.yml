name: Official release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      public_key: ${{ steps.trust.outputs.public_key }}
      manifest_url: ${{ steps.identity.outputs.manifest_url }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Validate tag and clean source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -z "$(git status --porcelain)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/release-manifest.json" >> "$GITHUB_OUTPUT"
      - name: Validate signing key and derive public trust root
        id: trust
        env:
          LCTK_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.LCTK_RELEASE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LCTK_RELEASE_ED25519_PRIVATE_KEY"
          public_key="$(go run ./cmd/release-manifest --print-public-key)"
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PUBLIC_KEY: ${{ needs.validate.outputs.public_key }}
      MANIFEST_URL: ${{ needs.validate.outputs.manifest_url }}
      KEY_ID: lctk-release-v1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Verify the host before packaging
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build host core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $trust = "-s -w -X github.com/lev-goryachev/lctk/internal/buildinfo.Version=$env:VERSION -X github.com/lev-goryachev/lctk/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/lev-goryachev/lctk/internal/buildinfo.Date=$date -X github.com/lev-goryachev/lctk/internal/releasebundle.TrustedKeyID=$env:KEY_ID -X github.com/lev-goryachev/lctk/internal/releasebundle.TrustedPublicKey=$env:PUBLIC_KEY -X github.com/lev-goryachev/lctk/internal/releasebundle.DefaultManifestURL=$env:MANIFEST_URL"
          go build -trimpath -ldflags $trust -o dist/package/lctk-core.exe ./cmd/lctk
          go build -trimpath -ldflags "$trust -H=windowsgui" -o "dist/lctk-setup-$env:VERSION-windows-amd64.exe" ./cmd/lctk-setup
          Copy-Item LICENSE,NOTICE,README.md,THIRD_PARTY_NOTICES.md dist/package/
      - name: Bind launcher to the immutable core identity
        shell: pwsh
        run: |
          $core = 'dist/package/lctk-core.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $core).Hash.ToLowerInvariant()
          $bytes = (Get-Item $core).Length
          go build -trimpath -ldflags "-s -w -X main.PackagedCoreSHA256=$hash -X main.PackagedCoreBytes=$bytes" -o dist/package/lctk.exe ./cmd/lctk-launcher
      - name: Verify the explicit unsigned Windows policy
        shell: pwsh
        run: |
          foreach ($file in @('dist/package/lctk-core.exe', 'dist/package/lctk.exe', "dist/lctk-setup-$env:VERSION-windows-amd64.exe")) {
            $status = (Get-AuthenticodeSignature $file).Status.ToString()
            if ($status -ne 'NotSigned') { throw "Unsigned Windows release policy violated for ${file}: $status" }
          }
      - name: Package, extract, and execute the real client entry point
        shell: pwsh
        run: |
          Copy-Item dist/package/lctk-core.exe dist/lctk-core-windows-amd64.exe
          Copy-Item dist/package/lctk.exe dist/lctk-launcher-windows-amd64.exe
          Compress-Archive -Path dist/package/* -DestinationPath "dist/lctk-$env:VERSION-windows-amd64.zip"
          Expand-Archive "dist/lctk-$env:VERSION-windows-amd64.zip" -DestinationPath dist/extracted
          $info = & dist/extracted/lctk.exe version --json | ConvertFrom-Json
          if ($info.version -ne $env:VERSION -or $info.os -ne 'windows' -or $info.arch -ne 'amd64') { throw 'Extracted Windows package identity is invalid.' }
      - name: Mirror and verify the pinned Podman runtime
        shell: pwsh
        run: |
          $client = "dist/lctk-podman-client-5.8.2-windows-amd64.zip"
          $machine = "dist/lctk-podman-machine-5.8.2-linux-amd64.tar.zst"
          $nvidia = "dist/nvidia-container-toolkit-base-1.19.1-1.x86_64.rpm"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/containers/podman/releases/download/v5.8.2/podman-remote-release-windows_amd64.zip" -OutFile $client
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/containers/podman-machine-os/releases/download/v5.8.2/podman-machine.x86_64.wsl.tar.zst" -OutFile $machine
          Invoke-WebRequest -UseBasicParsing -Uri "https://nvidia.github.io/libnvidia-container/stable/rpm/x86_64/nvidia-container-toolkit-base-1.19.1-1.x86_64.rpm" -OutFile $nvidia
          if ((Get-Item $client).Length -ne 30780191 -or (Get-FileHash -Algorithm SHA256 $client).Hash.ToLowerInvariant() -ne '1b60aae4bd4879c3932c283d2070bb87116ec1f0ab3a4a98eff7e65f318f9e4e') { throw 'Pinned Podman client identity differs.' }
          if ((Get-Item $machine).Length -ne 257374129 -or (Get-FileHash -Algorithm SHA256 $machine).Hash.ToLowerInvariant() -ne 'e2b6cbcadd8b41b708fecb58a246a20d737dee0ef26872a3f75b575f77eba968') { throw 'Pinned Podman machine identity differs.' }
          if ((Get-Item $nvidia).Length -ne 6190068 -or (Get-FileHash -Algorithm SHA256 $nvidia).Hash.ToLowerInvariant() -ne 'b12de77bdffd3df13cea4589a1b04a133b1ffcb250b860f7349420eed37aeb5d') { throw 'Pinned NVIDIA Container Toolkit package identity differs.' }
      - name: Generate Windows SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/lctk-windows-amd64.spdx.json
          upload-artifact: false
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: |
            dist/lctk-core-windows-amd64.exe
            dist/lctk-launcher-windows-amd64.exe
            dist/lctk-setup-${{ needs.validate.outputs.version }}-windows-amd64.exe
            dist/lctk-${{ needs.validate.outputs.version }}-windows-amd64.zip
            dist/lctk-podman-client-5.8.2-windows-amd64.zip
            dist/lctk-podman-machine-5.8.2-linux-amd64.tar.zst
            dist/nvidia-container-toolkit-base-1.19.1-1.x86_64.rpm
            dist/lctk-windows-amd64.spdx.json
          if-no-files-found: error

  image-architecture:
    needs: validate
    name: Code image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Normalize the image repository
        id: image
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lctk-code-intel"
          echo "IMAGE=$repository" >> "$GITHUB_ENV"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Execute code-intel tests on the native architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./images/code-intel
          platforms: linux/${{ matrix.arch }}
          target: test
          outputs: type=cacheonly
          cache-to: type=gha,mode=max,scope=code-intel-release-${{ matrix.arch }}
      - name: Build and push the native image architecture
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./images/code-intel
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ env.VERSION }}-${{ matrix.arch }}
          cache-from: type=gha,scope=code-intel-release-${{ matrix.arch }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Execute the native runtime image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          reference="$IMAGE@$DIGEST"
          mkdir -p ".artifacts/image-smoke/${{ matrix.arch }}/workspace" ".artifacts/image-smoke/${{ matrix.arch }}/state"
          container="lctk-code-intel-${{ matrix.arch }}-smoke"
          cleanup() {
            result=$?
            trap - EXIT
            if test "$result" -ne 0; then
              docker inspect "$container" || true
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            exit "$result"
          }
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{.Os}}/{{.Architecture}}')" = "linux/${{ matrix.arch }}"
          docker run --detach --name "$container" --network none \
            --env LCTK_PROJECT_ID=release-smoke \
            --mount "type=bind,source=$PWD/.artifacts/image-smoke/${{ matrix.arch }}/workspace,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/.artifacts/image-smoke/${{ matrix.arch }}/state,target=/var/lib/lctk" \
            "$reference"
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')"
            test "$health" != unhealthy
            if test "$health" = healthy; then break; fi
            sleep 1
          done
          test "$(docker inspect "$container" --format '{{.State.Health.Status}}')" = healthy
          docker exec "$container" test -f /var/lib/lctk/ready
      - name: Preserve the immutable architecture digest
        shell: bash
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > "image-digest-${{ matrix.arch }}.txt"
      - name: Upload the architecture digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-digest-${{ matrix.arch }}
          path: image-digest-${{ matrix.arch }}.txt
          if-no-files-found: error

  image:
    needs: [validate, image-architecture]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Normalize the image repository
        id: image
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lctk-code-intel"
          echo "IMAGE=$repository" >> "$GITHUB_ENV"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-image-digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish and inspect the immutable multi-architecture index
        shell: bash
        run: |
          set -euo pipefail
          inspect_with_retry() {
            local reference="$1"
            shift
            local attempt output
            for attempt in $(seq 1 12); do
              if output="$(docker buildx imagetools inspect "$@" "$reference" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              if (( attempt < 12 )); then sleep 5; fi
            done
            printf 'Image index inspection failed after %d attempts:\n%s\n' "$attempt" "$output" >&2
            return 1
          }
          amd64="$(cat digests/image-digest-amd64.txt)"
          arm64="$(cat digests/image-digest-arm64.txt)"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$amd64" "$IMAGE@$arm64"
          inspection="$(inspect_with_retry "$IMAGE:$VERSION")"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspection")"
          test "${digest#sha256:}" != "$digest"
          reference="$IMAGE@$digest"
          raw="$(inspect_with_retry "$reference" --raw)"
          jq -e '[.manifests[].platform | select(.os == "linux") | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' <<<"$raw"
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length == 2' <<<"$raw"
          printf 'CODE_IMAGE=%s\n' "$reference" > image.env
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign the immutable image
        shell: bash
        run: |
          source image.env
          cosign sign --yes "$CODE_IMAGE"
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.repository }}:${{ env.VERSION }}
          format: spdx-json
          output-file: ./lctk-code-intel.spdx.json
          upload-artifact: false
      - name: Measure immutable image downloads
        shell: bash
        run: |
          set -euo pipefail
          compressed_size() {
            local reference="$1" raw digest size maximum=0
            raw="$(docker buildx imagetools inspect --raw "$reference")"
            if jq -e '.manifests' >/dev/null <<<"$raw"; then
              while read -r digest; do
                size="$(docker buildx imagetools inspect --raw "${reference%@*}@$digest" | jq '[.config.size, (.layers[].size)] | add')"
                (( size > maximum )) && maximum="$size"
              done < <(jq -r '.manifests[].digest' <<<"$raw")
            else
              maximum="$(jq '[.config.size, (.layers[].size)] | add' <<<"$raw")"
            fi
            echo "$maximum"
          }
          source image.env
          inference_reference='ghcr.io/ggml-org/llama.cpp:server@sha256:14ab06c571008509adcedf635301edfa98071b1b8345269921d31ea4d519ae47'
          nvidia_inference_reference='ghcr.io/ggml-org/llama.cpp:server-cuda-b10257@sha256:37dd122824e58af9ec861955242abdeeade5a1dcf0ad768bf2b37f903c2805c6'
          {
            echo "CODE_IMAGE_BYTES=$(compressed_size "$CODE_IMAGE")"
            echo "INFERENCE_IMAGE_BYTES=$(compressed_size "$inference_reference")"
            echo "NVIDIA_INFERENCE_IMAGE_BYTES=$(compressed_size "$nvidia_inference_reference")"
          } >> image.env
          test "$(grep '^NVIDIA_INFERENCE_IMAGE_BYTES=' image.env | cut -d= -f2)" = 2586107421
      - name: Upload image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image
          path: |
            image.env
            lctk-code-intel.spdx.json
          if-no-files-found: error

  publish:
    needs: [validate, windows, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Download the complete release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release and migration notes
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/migration-notes.md <<EOF
          # LCTK $VERSION migration and rollback

          Project intelligence schema 1 is migrated to schema 2 on a copy. The original remains as \`semantic.db.rollback-v1\` until the rollback window is deliberately retired. A failed candidate health gate restores it automatically. Run \`lctk update rollback\` to select the previous verified host core and project image.
          EOF
          {
            echo "# LCTK $VERSION"
            echo
            echo "The unsigned Windows amd64 one-click setup, a keyless-signed multi-architecture code image, SPDX SBOMs, checksums, provenance attestations, and a signed component manifest are attached. macOS is not part of this release."
            echo
            echo "Windows can show an unknown-publisher or SmartScreen warning for the unsigned setup. Select More info and Run anyway only after confirming that the file came from this GitHub Release."
            echo
            sed -n '1,120p' CHANGELOG.md
          } > dist/RELEASE_NOTES.md
          {
            go list -m -json all
            (cd images/code-intel && go list -m -json all)
          } > dist/dependency-inventory.json
      - name: Generate checksums and signed release manifest
        env:
          LCTK_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.LCTK_RELEASE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          source dist/image.env
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          (cd dist && sha256sum lctk-* nvidia-* migration-notes.md RELEASE_NOTES.md dependency-inventory.json > SHA256SUMS)
          go run ./cmd/release-manifest \
            --version "$VERSION" --commit "$GITHUB_SHA" --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "$base" --code-image "$CODE_IMAGE" --code-image-bytes "$CODE_IMAGE_BYTES" \
            --inference-image-bytes "$INFERENCE_IMAGE_BYTES" --key-id lctk-release-v1 \
            --nvidia-inference-image-bytes "$NVIDIA_INFERENCE_IMAGE_BYTES" --nvidia-inference-image-unpacked-bytes 4360073216 \
            --artifact "lctk-core-windows-amd64.exe,host-core,windows,amd64,dist/lctk-core-windows-amd64.exe" \
            --artifact "lctk-launcher-windows-amd64.exe,host-launcher,windows,amd64,dist/lctk-launcher-windows-amd64.exe" \
            --artifact "lctk-setup-$VERSION-windows-amd64.exe,installer,windows,amd64,dist/lctk-setup-$VERSION-windows-amd64.exe" \
            --artifact "lctk-podman-client-5.8.2-windows-amd64.zip,podman-client,windows,amd64,dist/lctk-podman-client-5.8.2-windows-amd64.zip" \
            --artifact "lctk-podman-machine-5.8.2-linux-amd64.tar.zst,podman-machine,linux,amd64,dist/lctk-podman-machine-5.8.2-linux-amd64.tar.zst" \
            --artifact "nvidia-container-toolkit-base-1.19.1-1.x86_64.rpm,nvidia-container-toolkit-base,linux,amd64,dist/nvidia-container-toolkit-base-1.19.1-1.x86_64.rpm" \
            --artifact "lctk-$VERSION-windows-amd64.zip,archive,windows,amd64,dist/lctk-$VERSION-windows-amd64.zip" \
            --artifact "lctk-windows-amd64.spdx.json,sbom-host-windows,windows,amd64,dist/lctk-windows-amd64.spdx.json" \
            --artifact "lctk-code-intel.spdx.json,sbom-code-image,linux,multi,dist/lctk-code-intel.spdx.json" \
            --artifact "dependency-inventory.json,dependency-inventory,,,dist/dependency-inventory.json" \
            --artifact "SHA256SUMS,checksums,,,dist/SHA256SUMS" \
            --output dist/release-manifest.json
      - name: Attest every published file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/lctk-*
            dist/nvidia-*
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/migration-notes.md
            dist/RELEASE_NOTES.md
            dist/dependency-inventory.json
      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/lctk-*
            dist/nvidia-*
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/migration-notes.md
            dist/dependency-inventory.json
